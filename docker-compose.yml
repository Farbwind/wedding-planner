# Starten mit: docker compose up -d
# Danach: Gästeseite auf http://localhost:8080, Verwaltung auf http://localhost:8080/admin
services:
  hochzeit:
    image: ghcr.io/farbwind/wedding-planner:latest
    # Zum Selbstbauen aus dem Quellcode statt des fertigen Images: die Zeile "image" löschen und diese einkommentieren
    # build: .
    container_name: hochzeit
    ports:
      - "8080:3000"
    environment:
      TZ: Europe/Berlin
      # Adresse, unter der die Seite erreichbar ist (für QR-Codes und Kalenderdateien)
      PUBLIC_URL: http://localhost:8080
      # Zugänge zur Verwaltung, mit Komma getrennt (bis zu sechs)
      ADMIN_USERS: "Anna,Ben"
      # Erstes Passwort für alle Zugänge ohne Passwort (mindestens 8 Zeichen). Nur nötig, wenn der Server
      # im Internet steht. Lokal oder im Heimnetz legst du das Passwort beim ersten Öffnen von /admin fest.
      # Danach die Zeile wieder löschen, das Passwort lässt sich in der Verwaltung ändern.
      # ADMIN_PASSWORD: "hier-ein-eigenes-passwort"
    volumes:
      - daten:/data
    restart: unless-stopped
volumes:
  daten:
